[Unit]
Requires=microduck-camera-feed.service
After=microduck-camera-feed.service
[Service]
Environment=ORT_DYLIB_PATH=/opt/robot/feetech-ft5-r5/onnxruntime/libonnxruntime.so.1.28.0
Environment=GST_PLUGIN_PATH=/usr/local/lib/gstreamer-1.0
ExecStart=
ExecStart=/opt/robot/feetech-ft5-r5/mediad --config /etc/microduck/vision.toml --camera-device /dev/video42 --host 127.0.0.1 --no-remote --no-auto-exposure --rotate 0
Restart=no
